<!doctype html>
<html><head><meta charset="utf-8"><title>R5 About - Dynamic</title></head>
<body>
<h1>R5 About - Dynamic from /api/v1/about</h1>
<pre id="about">Loading...</pre>
<script>
fetch('/api/v1/about').then(r=>r.json()).then(j=>{
  document.getElementById('about').textContent = JSON.stringify(j,null,2);
}).catch(e=>{document.getElementById('about').textContent='Error: '+e});
</script>
</body></html>
